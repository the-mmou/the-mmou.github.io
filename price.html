<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>價目表｜mmou 美甲工作室</title>
<meta name="description" content="竹南手作凝膠美甲工作室，預約制。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="price">
  <h2>價目表</h2>
  <p class="lead">凝膠美甲皆含基礎保養與建構。</p>
  <div class="price">
    <div class="card"><h3>凝膠美甲</h3>
      <div class="row"><span>單色</span><b>800</b></div>
      <div class="row"><span>碎鑽 / 特殊膠</span><b>900</b></div>
      <div class="row"><span>貓眼</span><b>1,000</b></div>
      <div class="row"><span>漸層</span><b>1,200</b></div>
      <div class="row"><span>鏡面</span><b>1,300</b></div>
      <div class="row"><span>法式</span><b>1,400</b></div>
      <p class="note">以上跳一色 +50 ・ 遮游離線 / 底色 +100</p>
      <div class="row" style="margin-top:12px"><span>自帶圖</span><b>傳圖報價</b></div>
      <p class="note">三張圖為限，仿作無法 100% 複製</p>
    </div>
    <div class="card"><h3>卸甲與補甲</h3>
      <div class="row"><span>卸甲續作</span><b>本店 200 / 他店 300</b></div>
      <div class="row"><span>純卸甲（含修甲型）</span><b>500</b></div>
      <div class="row"><span>指甲油 / 硬甲油卸除</span><b>100</b></div>
      <p class="note">不卸複雜鑽飾 / 飾品</p>
      <div class="row"><span>補甲</span><b>60 / 指</b></div>
    </div>
    <div class="card"><h3>保養</h3>
      <div class="row"><span>基礎保養</span><b>700</b></div>
      <p class="note">含甘皮修剪、兩側硬皮、修甲型、硬甲油</p>
      <div class="row"><span>指緣精華導入</span><b>150</b></div>
      <p class="note" style="margin-top:14px">本店暫無延甲及足部服務。</p>
    </div>
  </div>
</section>

<section style="padding-top:0;text-align:center"><a class="btn" href="book.html">選好款式，去預約並估價</a></section>

</body>
</html>
